name: docker-build

# 云端构建镜像并推送 GHCR，生产服务器只拉取、不构建。
# 背景：SWAS 2C/1.8G 机内构建会打满 CPU 导致云助手/隧道进程被杀、对外失联（2026-10-01）。

on:
  workflow_dispatch:
  push:
    branches:
      - feat/workbuddy-zcode-runtimes

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: crystepj-max

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/multica-janeai-backend:dev
            ${{ env.REGISTRY }}/${{ env.OWNER }}/multica-janeai-backend:sha-${{ github.sha }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/multica-janeai-web:dev
            ${{ env.REGISTRY }}/${{ env.OWNER }}/multica-janeai-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
